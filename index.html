 if(hit.type==='drink'&&G.passes[1]>0){const g=gainFor(hit,1);if(G.buzz[1]+g>=97||(g>=20&&G.buzz[1]>55&&Math.random()<0.6))G.rev.hPass=true}
 state='reveal'}
function updReveal(dt){const r=G.rev;r.t+=dt;const k=clamp((r.t-0.15)/0.5,0,1);G.lids[r.pi]=1-k;G.lids[r.hi]=1-k;if(!r.popped&&r.t>0.15){r.popped=true;sfx('pop')}
 if(r.hPass&&!r.hSaid&&r.t>0.9){r.hSaid=true;G.passes[1]--;toast(G.H.name+' passes! You drink yours for the point.','#ffcc80')}
 if(QA.auto&&r.t>0.9){if(QA.autoPass&&canPass()&&gainFor(G.slots[r.pi],0)>=15)doPass();startRace()}
 else if(r.t>3.2)startRace()}
const canPass=()=>state==='reveal'&&G.passes[0]>0&&!G.rev.pPass&&G.slots[G.rev.pi].type==='drink'&&!G.rev.hPass;
function doPass(){if(!canPass())return;G.rev.pPass=true;G.passes[0]--;toast('You pass. '+G.H.name+' drinks for the point.','#ffcc80');sfx('whiff')}
function df(it){return (it.fz?0.8:1)*(1-it.abv/220)}
function mkSide(it,s,pass){const o={it,mode:it.type==='snack'?'snack':pass?'pass':'drink',level:1,pen:0,taps:0,done:false,auto:false,t:0,cOff:rnd(-0.6,0.6)};
 o.ph=o.mode==='drink'?'reach':o.mode==='snack'?'munch':'done';if(o.mode==='pass'){o.done=true;o.level=1}
 if(s===1&&o.mode==='drink'){const h=G.H,hb=G.buzz[1]/100;o.tReach=h.react*(1+hb*0.8)*rnd(0.85,1.25)+(Math.random()<hb*0.3?0.6:0);o.rate=h.speed*df(it)*(1-hb*0.35)*rnd(0.88,1.12);o.tSlam=0.22+hb*0.45+rnd(0,0.2)}
 return o}
function startRace(){const r=G.rev;G.race={t:0,winner:-1,go:0.7,s:[mkSide(G.slots[r.pi],0,r.pPass),mkSide(G.slots[r.hi],1,r.hPass)]};
 const a=G.race.s[0],b=G.race.s[1];G.race.compete=a.mode==='drink'&&b.mode==='drink';
 if(a.mode==='snack')toast('Snack! Tap to munch it.','#c5e1a5');else if(a.mode==='drink'&&!G.race.compete)toast('No race: finish it for the point.','#ffe082');
 state='race'}
function pRate(it){return 3.4*df(it)*(1-G.buzz[0]/100*0.3)}
function finishSide(i){const r=G.race,s=r.s[i];if(s.done)return;s.done=true;s.level=0;s.ph='done';
 if(s.mode==='drink'){const g=gainFor(s.it,i);G.buzz[i]+=g;G.stat.drinks[i]++;if(i===0&&s.it.abv>=60)G.stat.strong++;
  if(r.winner<0){const other=r.s[1-i];if(other.mode!=='snack'||true){r.winner=i;G.pts[i]++;sfx(i===0?'point':'lose');shake=0.25;if(!other.done&&other.mode==='drink'){other.auto=true;other.ph='chug'}}}
  else sfx('slam');if(G.buzz[i]>55&&Math.random()<0.5)setTimeout(()=>sfx('hic'),700)}
 else if(s.mode==='snack'){G.buzz[i]=Math.max(0,G.buzz[i]-s.it.rec);G.stat.snacks[i]++;toast((i===0?'You':G.H.name)+' munched '+s.it.n.toLowerCase()+': buzz −'+s.it.rec+'%','#c5e1a5')}}
function updRace(dt){const r=G.race;r.t+=dt;if(r.go>0)r.go-=dt;const P0=r.s[0],P1=r.s[1];
 for(const s of r.s)if(s.pen>0)s.pen-=dt;
 // house
 if(!P1.done){P1.t+=dt;if(P1.mode==='snack'){P1.level=1-P1.t/1.2;if(P1.t>=1.2)finishSide(1)}
  else if(P1.auto){P1.level-=dt/0.7;if(P1.level<=0)finishSide(1)}
  else if(P1.ph==='reach'){if(P1.t>=P1.tReach){P1.ph='chug';P1.t=0}}
  else if(P1.ph==='chug'){P1.level-=P1.rate*dt/P1.it.oz;if(P1.level<=0){P1.level=0;P1.ph='slam';P1.t=0}}
  else if(P1.ph==='slam'&&P1.t>=P1.tSlam){sfx('slam');finishSide(1)}}
 // player
 if(!P0.done){if(P0.auto){P0.level-=dt/0.7;if(P0.level<=0)finishSide(0)}
  else if(P0.ph==='chug'&&(P.n>0&&!P.btn||QA.auto||keyHold)&&P0.pen<=0){P0.level-=pRate(P0.it)*dt/P0.it.oz*(QA.auto?QA.autoRate||1:1);gulpT-=dt;if(gulpT<=0){gulpT=0.35;sfx('gulp')}if(P0.level<=0){P0.level=0;P0.ph='slam';P0.cOff=(Math.random()<0.5?-1:1)*rnd(0.4,0.85)}}
  if(P0.ph==='munch'&&!P0.done){P0.mt=(P0.mt||0)+dt;if(P0.mt>4)munchTap()}
  if(QA.auto&&P0.pen<=0&&!P0.done){const rt=QA.autoReact||0.3;if(P0.ph!==P0.lph){P0.lph=P0.ph;P0.t=0}P0.t+=dt;
   if(P0.ph==='reach'&&P0.t>rt)P0.ph='chug';else if(P0.ph==='slam'&&P0.t>rt){sfx('slam');finishSide(0)}else if(P0.ph==='munch'&&P0.t>0.3){P0.t=0;munchTap()}}}
 if(P0.done&&P1.done&&r.t>0.4){G.res={t:0};state='result'}}
let gulpT=0,keyHold=false;
function munchTap(){const s=G.race.s[0];if(s.done)return;s.mt=0;s.taps++;s.level=1-s.taps/3;sfx('munch');if(s.taps>=3)finishSide(0)}
function pGlassPos(){const pb=G.buzz[0]/100;return{x:L.gx+Math.sin(T*1.7)*pb*L.gw+Math.sin(T*3.1)*pb*pb*L.gw*0.4,y:L.gy+Math.sin(T*2.3)*pb*12}}
function coasterPos(){const pb=G.buzz[0]/100,s=G.race.s[0];return{x:L.gx+s.cOff*L.gw+Math.sin(T*1.3+1)*pb*L.gw*1.1,y:L.gy-6+Math.cos(T*1.9)*pb*10}}
function raceTap(x,y){const s=G.race.s[0];if(s.done||s.auto)return;if(s.pen>0){return}const pb=G.buzz[0]/100;
 if(s.ph==='munch'){munchTap();return}
 if(s.ph==='reach'){const p=camPt(pGlassPos()),gh=glassTop(s.it.g)*L.gs,hw=Math.max(40,SH[s.it.g][1]*L.gs/2+20);
  if(Math.abs(x-p.x)<hw&&y>p.y-gh-24&&y<p.y+26){if(Math.random()<Math.max(0,pb-0.35)*0.55){s.pen=0.35;sfx('whiff');toast('Butterfingers!','#ff8a80')}else{s.ph='chug';sfx('tap')}}
  else{s.pen=0.3;sfx('whiff');toast('Whiff! Missed the glass','#ff8a80')}return}
 if(s.ph==='chug'){s.level-=pRate(s.it)*0.16/s.it.oz;sfx('gulp');if(s.level<=0){s.level=0;s.ph='slam';s.cOff=(Math.random()<0.5?-1:1)*rnd(0.4,0.85)}return}
 if(s.ph==='slam'){const p=camPt(coasterPos());if(Math.hypot(x-p.x,(y-p.y)*1.4)<46){sfx('slam');shake=0.2;finishSide(0)}else{s.pen=0.3;sfx('whiff');toast('Missed the table!','#ff8a80')}}}
function updResult(dt){const r=G.res;r.t+=dt;if(r.t>(QA.auto?0.6:2.2))nextRound()}
function nextRound(){if(state!=='result')return;
 const b0=G.buzz[0]>=100,b1=G.buzz[1]>=100;
 if(b0||b1){G.blkWho=b0&&b1?(G.pts[0]>G.pts[1]?1:0):b0?0:1;if(b0&&b1)G.blkBoth=true;state='blackout';G.bt=0;sfx('black');return}
 if(G.pts[0]>=WIN_PTS||G.pts[1]>=WIN_PTS){endMatch(G.pts[0]>=WIN_PTS,G.pts[0]>=WIN_PTS?'First to '+WIN_PTS+' points!':G.H.name+' got '+WIN_PTS+' points first.');return}
 if(G.round>=LAST_CALL){const w=G.pts[0]>G.pts[1]||(G.pts[0]===G.pts[1]&&G.buzz[0]<=G.buzz[1]);endMatch(w,'Last call! '+(G.pts[0]===G.pts[1]?'Tied on points: the soberer one wins.':'Most points wins.'));return}
 const r=G.rev;G.slots[r.pi]=makeItem();G.slots[r.hi]=makeItem();G.lids[r.pi]=1;G.lids[r.hi]=1;
 for(let i=0;i<2;i++)G.buzz[i]=Math.max(0,G.buzz[i]-2.5);
 G.spinner^=1;G.round++;G.turnT=0;G.hw=false;G.rev=null;G.race=null;state='turn';
 if(Math.random()<0.35){G.line=pick(G.H.lines);G.lineT=2.6}}
function updBlackout(dt){G.bt+=dt;G.blk[G.blkWho]=clamp(G.bt/1.2,0,1);if(G.blkBoth)G.blk[1-G.blkWho]=clamp(G.bt/1.2,0,1);
 if(G.bt>(QA.auto?1.2:2.6))endMatch(G.blkWho===1,G.blkWho===1?G.H.name+' blacked out! You\u2019re still standing.':'You blacked out!'+(G.blkBoth?' (You both went down; points decided it.)':''))}
function careerScore(){const b=LS.get('rr_best',[]);return b.reduce((a,v)=>a+(+v||0),0)}
function endMatch(win,reason){G.win=win;G.reason=reason;G.score=G.pts[0]*100+(win?1000*(G.house+1)+Math.round((100-Math.min(100,G.buzz[0]))*5):0);
 const b=LS.get('rr_best',[]);if(!(b[G.house]>=G.score))b[G.house]=G.score;LS.set('rr_best',b);
 if(win)LS.set('rr_beat',Math.max(LS.get('rr_beat',0),G.house+1));G.overT=0;state='over';sfx(win?'win':'lose')}
function updTurn(dt){G.turnT+=dt;
 if(G.tween){G.tween.t+=dt*4;G.theta=lerp(G.tween.a,G.tween.b,Math.min(1,G.tween.t));if(G.tween.t>=1)G.tween=null}
 if(G.spinner===1&&G.turnT>1.2&&!drag){if(!G.hw&&G.buzz[1]>75&&G.pts[1]>=1&&Math.random()<0.5){water(1);G.turnT=0.4;return}houseSpin()}
 else if(G.spinner===0&&QA.auto&&G.turnT>0.35&&!drag)playerSpin(rnd(8,16)*(Math.random()<0.5?-1:1))}
function update(dt){T+=dt;if(toastT>0)toastT-=dt;if(shake>0)shake-=dt;if(!G||G.paused)return;if(G.lineT>0)G.lineT-=dt;
 if(state==='turn')updTurn(dt);else if(state==='spin')updSpin(dt);else if(state==='reveal')updReveal(dt);else if(state==='race')updRace(dt);
 else if(state==='result')updResult(dt);else if(state==='blackout')updBlackout(dt);else if(state==='over')G.overT+=dt;
 if(lp&&AC){const b=state==='over'||!G?0:clamp(G.buzz[0]/100,0,1);lp.frequency.value=16000*(1-b*0.88)+900}}

/* ---------- UI helpers ---------- */
const FONT='"Trebuchet MS","Segoe UI",system-ui,sans-serif';
let FS=1;function F(px,w){return (w||'bold')+' '+Math.round(Math.max(16,px)*FS)+'px '+FONT}
function txt(g,s,x,y,px,col,al,bl,w){g.font=F(px,w);g.fillStyle=col;g.textAlign=al||'center';g.textBaseline=bl||'middle';g.fillText(s,x,y)}
function fit(g,s,px,maxW,w){px=Math.max(16,px);g.font=F(px,w);while(px>16&&g.measureText(s).width>maxW){px--;g.font=F(px,w)}return px}
function wrap(g,s,maxW,px,w){g.font=F(px,w);const out=[];for(const para of String(s).split('\n')){let line='';for(const word of para.split(' ')){const t=line?line+' '+word:word;if(g.measureText(t).width>maxW&&line){out.push(line);line=word}else line=t}out.push(line)}return out}
function para(g,s,x,y,maxW,px,col,al,lh,w){const ls=wrap(g,s,maxW,px,w);g.fillStyle=col;g.textAlign=al||'left';g.textBaseline='top';const h=Math.max(16,px)*FS*(lh||1.3);ls.forEach((l,i)=>g.fillText(l,al==='center'?x+maxW/2:x,y+i*h));return ls.length*h}
function button(id,x,y,w,h,label,col,fn,o){o=o||{};h=Math.max(44,h);w=Math.max(44,w);const b={id,x,y,w,h,fn};btns.push(b);const g=ctx,pr=P.btn&&P.btn.id===id;
 g.save();g.globalAlpha=o.dim?0.5:1;g.fillStyle='rgba(0,0,0,.35)';rr(g,x+2,y+4,w,h,12);g.fill();g.fillStyle=col;rr(g,x,y+(pr?2:0),w,h,12);g.fill();g.strokeStyle='rgba(255,240,210,.9)';g.lineWidth=2.5;g.stroke();
 const px=fit(g,label,o.px||Math.min(22,h*0.42),w-14);txt(g,label,x+w/2,y+h/2+(pr?2:0)+1,px,o.fg||'#fff');g.restore();return b}
function hitBtn(x,y){for(let i=btns.length-1;i>=0;i--){const b=btns[i];if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h)return b}return null}
function panel(x,y,w,h){const g=ctx;g.fillStyle='rgba(0,0,0,.4)';rr(g,x+3,y+5,w,h,16);g.fill();const gr=g.createLinearGradient(0,y,0,y+h);gr.addColorStop(0,'#5d3418');gr.addColorStop(1,'#3a1d0b');g.fillStyle=gr;rr(g,x,y,w,h,16);g.fill();g.strokeStyle='#d7a35a';g.lineWidth=3;g.stroke()}

async function gameOver(score,o={}){if(!G)return;build();score=Math.round(+score);const b=o.board||(G.boards&&G.boards[0]&&G.boards[0].id)||'main';
  if(!sane(score)||(G.order==='desc'&&score<=0&&!G.allowZero))return null;const pv=o.best!=null?Math.round(+o.best):score;if(!sane(pv))return null;

  lastShown=b;head(o.heading||G.overTitle||'GAME OVER',G.title+(boardLabel(b)?' · '+boardLabel(b):''));
  card.append($('div',{},o.label||'Your score'),$('div',{class:'big'},fmt(score)),$('div',{class:'note'},o.best!=null?(o.label?'':'Best: '+fmt(pv)+(o.newBest?'  ★ New best! ★':'')):isPB?(pb==null?'':'★ New personal best! ★'):'Your best: '+fmt(pb)));

    tapBtn(skip,()=>{close();res({skipped:true})});

<!-- gamepad:start -->
<script src="gamepad.js?v=2"></script>
<script>
try{HOW.push(['🎮 Controller','Xbox, PlayStation or Switch controllers work (USB or Bluetooth, on a computer or paired to your phone).\nYour spin: A, or flick the stick / D-pad left or right.\nThe race: A grabs your glass, HOLD A to chug, A again to slam it down.\nY: 💧 water on your turn. Pass/Drink buttons: D-pad + A.\nStart: pause. Select: sound on/off. Menus: D-pad to pick, A to select, B to go back.'])}catch(e){}
(function(){
var PLAY={turn:1,spin:1,race:1,result:1};
function ov(){return !!document.querySelector('#palbOv.on,#smpLock.on')}
function canSpin(){return G&&!G.paused&&state==='turn'&&G.spinner===0&&!G.tween&&!G.spin&&!drag}
function spin(dir){if(!canSpin())return;playerSpin((dir||(Math.random()<.5?-1:1))*rnd(8,16))}
var flick=0;
GamepadSupport.init({
 keys:{a:function(p){if(!G||G.paused)return;
   if(state==='race'){window.dispatchEvent(new KeyboardEvent(p?'keydown':'keyup',{code:'Space',key:' ',bubbles:true,cancelable:true}));return}
   if(!p)return;if(state==='turn')spin(0);else if(state==='result'&&G.res&&G.res.t>0.5)nextRound()},
  x:function(p){if(p&&state==='turn')spin(0)},
  y:function(p){if(p&&state==='turn'&&G&&!G.spin&&!G.paused)water(0)},
  b:function(){},left:function(p){if(p)spin(-1)},right:function(p){if(p)spin(1)},up:function(){},down:function(){},
  start:function(p){if(p&&G&&state!=='over')G.paused=!G.paused},
  back:function(p){if(p)setMute(!muted)}},
 noRepeat:['a','x','y','left','right','start','back'],repeat:false,
 ignoreSel:'#dock,#mute,#inst,#ios,.tb,#dockHint',
 menu:function(){return ov()||!G||G.paused||!PLAY[state];},
 items:GamepadSupport.list(function(){if(ov())return [];var L=btns.filter(function(b){return !/^(pause|mute|music)$/.test(b.id)||!G});
   L.sort(function(a,b){return (b.id==='go'||b.id==='res')-(a.id==='go'||a.id==='res')});return L;},{scale:1}),
 isPaused:function(){return !!(G&&G.paused)},
 pause:function(){if(G&&!G.paused&&state!=='over')G.paused=true},
 back:function(){if(ov())return false;
  if(G&&G.paused){G.paused=false;return true}
  if(state==='how'){state='title';return true}
  var b=btns.find(function(q){return q.id==='back'});if(b){b.fn();return true}
  return true;},
 hint:{text:'🎮 Controller: A spins · hold A to chug · Y water · Start pause',when:function(){return state==='title'&&!ov()}}
});
})();
</script>
<!-- gamepad:end -->
</body></html>
